[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georeg"
version = "1.0.0"
description = "Automated satellite/aerial image georegistration: SIFT/ORB -> RANSAC -> GeoTIFF"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python>=4.8", "rasterio>=1.3.9", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gdal = ["gdal"]

[project.scripts]
georeg = "georeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
